[package]
name = "crosswalk-wasm"
version.workspace = true
edition.workspace = true
# Spelled out (not `license.workspace = true`) because the wasm-pack pinned by
# jetli/wasm-pack-action predates Cargo workspace field inheritance and rejects
# an inherited `license`. Keep in sync with [workspace.package].license.
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "wasm-bindgen bindings for the Crosswalk CEL mapping runtime"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crosswalk-core = { version = "0.2.0", path = "../crosswalk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
